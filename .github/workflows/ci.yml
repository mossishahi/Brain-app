name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A run in progress on an older commit of the same ref is not worth finishing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The app's test suites load a real published content bundle: they
      # materialize the Brain Registry's serving store from its RELEASE TAGS and
      # validate against it. That is deliberate — it is what catches a content
      # change that the app cannot execute — but it means CI must check out both
      # repositories side by side, exactly as a developer has them.
      - name: Check out the app
        uses: actions/checkout@v4
        with:
          path: app

      - name: Check out the Brain Registry (tags included)
        uses: actions/checkout@v4
        with:
          repository: mossishahi/Brain
          path: brain
          # fetch-depth: 0 is REQUIRED, not an optimization: releases are
          # annotated tags and the store is materialized from them. A shallow
          # clone has no tags, so every content test would silently have
          # nothing to validate against.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Build
        working-directory: app
        run: npm run build

      - name: Test
        working-directory: app
        run: npm test

  # Guards that two modules holding the same knowledge have not drifted apart.
  # These are cheap and they fail loudly, which is the point: the alternative is
  # discovering the divergence through wrong behaviour months later.
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - uses: actions/checkout@v4
        with:
          repository: mossishahi/Brain
          path: brain

      # The hash-ngram embedder exists as two intentionally identical copies in
      # two separate repositories: the registry embeds taxonomy nodes with it,
      # the app embeds queries with it, and a single differing byte silently
      # puts the two into different vector spaces. Runtime checksums catch that
      # and disable the semantic lane — correct, but a silent capability loss.
      # Catch it here instead.
      - name: The embedder copies are byte-identical
        run: diff -u brain/src/embedder.ts app/packages/core/src/embedder.ts
