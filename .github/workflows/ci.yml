name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A run in progress on an older commit of the same ref is not worth finishing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The app's test suites load a real published content bundle: they
      # materialize the Brain Registry's serving store from its RELEASE TAGS and
      # validate against it. That is deliberate — it is what catches a content
      # change that the app cannot execute — but it means CI must check out both
      # repositories side by side, exactly as a developer has them.
      - name: Check out the app
        uses: actions/checkout@v7
        with:
          path: app

      - name: Check out the Brain Registry (tags included)
        uses: actions/checkout@v7
        with:
          repository: mossishahi/Brain
          path: brain
          # fetch-depth: 0 is REQUIRED, not an optimization: releases are
          # annotated tags and the store is materialized from them. A shallow
          # clone has no tags, so every content test would silently have
          # nothing to validate against.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      # The store must exist BEFORE the parallel test lanes: several suites
      # materialize it lazily, and while re-scans are atomic (staging +
      # rename), two lanes extracting the same missing version concurrently
      # would collide. Materialized here, the lanes' own invocations find
      # nothing to extract and only re-verify.
      - name: Materialize the registry store once
        run: node brain/scripts/materialize-store.mjs --quiet

      - name: Build
        working-directory: app
        run: npm run build

      # Wall time is dominated by two long integration suites — server
      # (real servers, full offline pipelines) and worker (end-to-end runs).
      # They run as background lanes while the fast package suites run in
      # the foreground, so the step ends at the slowest lane instead of the
      # sum. Lanes reuse the dist from the Build step (node --test directly;
      # the workspace `test` scripts would rebuild), and the web workspace
      # needs no lane — its test IS its build, already done above. Lane
      # output prints when the lane finishes.
      - name: Test (server and worker lanes run alongside the rest)
        working-directory: app
        shell: bash
        run: |
          set -uo pipefail
          (cd apps/server && node --test dist/test/*.test.js) > server-tests.log 2>&1 &
          SERVER_PID=$!
          (cd apps/worker && node --test dist/test/*.test.js) > worker-tests.log 2>&1 &
          WORKER_PID=$!
          FAST_RC=0
          for dir in packages/core packages/protocol packages/credit-recovery \
                     packages/content packages/telemetry packages/registry-client \
                     packages/agent-runtime packages/host-tools \
                     packages/provider-anthropic packages/executor-claude-agent \
                     packages/brainstorm-runtime; do
            echo "=== $dir"
            (cd "$dir" && node --test dist/test/*.test.js) || FAST_RC=1
          done
          WORKER_RC=0; SERVER_RC=0
          wait "$WORKER_PID" || WORKER_RC=1
          echo "=== apps/worker (exit $WORKER_RC)"
          cat worker-tests.log
          wait "$SERVER_PID" || SERVER_RC=1
          echo "=== apps/server (exit $SERVER_RC)"
          cat server-tests.log
          exit $(( FAST_RC + WORKER_RC + SERVER_RC == 0 ? 0 : 1 ))

  # Guards that two modules holding the same knowledge have not drifted apart.
  # These are cheap and they fail loudly, which is the point: the alternative is
  # discovering the divergence through wrong behaviour months later.
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: app
      - uses: actions/checkout@v7
        with:
          repository: mossishahi/Brain
          path: brain

      # The hash-ngram embedder exists as two intentionally identical copies in
      # two separate repositories: the registry embeds taxonomy nodes with it,
      # the app embeds queries with it, and a single differing byte silently
      # puts the two into different vector spaces. Runtime checksums catch that
      # and disable the semantic lane — correct, but a silent capability loss.
      # Catch it here instead.
      - name: The embedder copies are byte-identical
        run: diff -u brain/src/embedder.ts app/packages/core/src/embedder.ts
